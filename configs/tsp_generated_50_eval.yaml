seed: 42
log_level: INFO
results_dir: results
default_problem: generated50
default_method: aco

settings:
  problem_type: tsp
  problem_meta:
    source: generated
    n_cities: 10
    scale: 100.0

  method_params:
    max_iterations: 300

  llm:
    enabled: true
    provider: openai
    model: gpt-4o-mini
    api_key_env: METIS_API_KEY
    base_url: https://api.metisai.ir/openai/v1
    temperature: 0.1

  evaluation:
    enabled: true
    repeats: 5
    methods: ["aco", "ga_tsp", "hopfield"]
    make_plots: true
    save_per_run: true
