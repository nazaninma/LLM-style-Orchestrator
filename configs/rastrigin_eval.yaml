seed: 42
log_level: INFO
results_dir: results
default_problem: rastrigin
default_method: pso

settings:
  problem_type: function_optimization
  problem_meta:
    function: rastrigin
    dimension: 30



  early_stopping:
    enabled: true
    patience: 50
    min_delta: 1e-8

  method_params:
    n_particles: 40
    max_iterations: 300
    w: 0.7
    c1: 1.5
    c2: 1.5
    w_decay: true
    velocity_clamp: 0.5

  llm:
    enabled: true
    provider: openai
    model: gpt-4o-mini
    api_key_env: METIS_API_KEY
    base_url: https://api.metisai.ir/openai/v1
    temperature: 0.1

  evaluation:
      enabled: true
      repeats: 5
      methods: ["pso", "ga", "random_search"]
      make_plots: true
      save_per_run: true

  feedback_loop:
      enabled: true
      max_rounds: 3
      min_confidence: 0.55