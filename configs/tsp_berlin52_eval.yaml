seed: 42
log_level: INFO
results_dir: results
default_problem: berlin52
default_method: aco

settings:
  problem_type: tsp
  problem_meta:
    source: tsplib
    data_dir: data/tsplib
    problem_id: light_berlin52

  method_params:
    max_iterations: 400

  llm:
    enabled: false
    provider: openai
    model: gpt-4o-mini
    api_key_env: METIS_API_KEY
    base_url: https://api.metisai.ir/openai/v1
    temperature: 0.1

  evaluation:
    enabled: true
    repeats: 5
    methods: ["aco", "ga_tsp", "hopfield"]
    make_plots: true
    save_per_run: true
  
  feedback_loop:
    enabled: true
    max_rounds: 3
    min_confidence: 0.55