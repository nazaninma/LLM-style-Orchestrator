[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metamind"
version = "0.1.0"
description = "MetaMind: CI methods + LLM-style orchestrator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0.1",
  "numpy>=1.24",
  "matplotlib>=3.7",
  "scipy>=1.10",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "openai>=1.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
metamind = "metamind.main:main"
